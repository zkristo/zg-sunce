<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunčane terase — gdje je sunce u zagrebačkim kafićima</title>
  <meta name="description" content="3D karta Zagreba u stvarnom vremenu: koji su kafići trenutno na suncu, a koji u sjeni.">
  <meta name="theme-color" content="#e9edf2">
  <!-- Raise ?v= on every release so phones do not keep an old copy (GitHub Pages caches for 10 min). -->
  <link rel="stylesheet" href="style.css?v=23">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "suncalc": "https://cdn.jsdelivr.net/npm/suncalc@1.9.0/+esm"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D karta Zagreba"></canvas>

  <header id="top">
    <h1>Sunčane terase</h1>
    <span id="count" class="chip" hidden></span>
    <span id="under" class="chip" hidden></span>
    <span id="cloud" class="chip" hidden></span>
  </header>

  <div id="banner" hidden></div>

  <nav id="tools" aria-label="Alati">
    <button id="btn-north" title="Okreni prema sjeveru" aria-label="Okreni prema sjeveru">
      <svg id="needle" viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l4.5 10h-9z" fill="#e5484d"/><path d="M12 22l-4.5-10h9z" fill="#9aa3ad"/></svg>
    </button>
    <button id="btn-locate" title="Moja lokacija" aria-label="Moja lokacija">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
    <button id="btn-list" title="Kafići na suncu" aria-label="Kafići na suncu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button id="btn-info" title="O karti" aria-label="O karti">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>
    </button>
  </nav>

  <section id="panel" hidden>
    <button id="panel-close" aria-label="Zatvori">×</button>
    <div id="panel-body"></div>
  </section>

  <footer id="timebar">
    <input id="slider" type="range" min="0" max="100" step="1" value="0" aria-label="Doba dana">
    <div class="ticks">
      <span id="t-rise"></span>
      <button id="clock" title="Vrati na sada" aria-label="Trenutno prikazano vrijeme; dodirni za povratak na sada">--:--</button>
      <span id="t-set"></span>
    </div>
  </footer>

  <div id="loading">Učitavanje grada…</div>

  <template id="tpl-info">
    <h2>O karti</h2>
    <p>Karta prikazuje gdje u Zagrebu – u svih 17 gradskih četvrti – trenutno pada sunce.
      Položaj sunca računa se za stvarno vrijeme i osvježava svake minute, a klizačem možeš pogledati ostatak dana (dodir na vrijeme vraća na sada).</p>
    <p><span class="dot sun"></span> terasa na suncu &nbsp; <span class="dot tree"></span> pod krošnjom &nbsp; <span class="dot shade"></span> terasa u sjeni zgrada</p>
    <p><strong>Koliko je točno?</strong> Zgrade su pojednostavljene u blokove do visine sljemena krova, a tende i
      suncobrani nisu u modelu. Stabla su iz gradskog katastra zelenila (samo javne površine, većinom stanje iz 2016.)
      i prikazana su kao krošnje približne veličine; listopadna stabla bacaju sjenu od 15. travnja do 31. listopada. Položaj terase procijenjen je kao najbliži otvoreni prostor uz kafić, pa se može
      razlikovati od stvarnog. Oblake model ne vidi — za njih služi oznaka naoblake.</p>
    <p class="small">Podaci: 3D model zgrada <a href="https://data.zagreb.hr/dataset/?q=zg3d" target="_blank" rel="noopener">ZG3D 2022, Grad Zagreb</a> (Otvorena dozvola) ·
      stabla: Katastar zelenila Grada Zagreba ·
      kafići, ceste, pruge i vode © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> doprinositelji ·
      dodatni kafići <a href="https://overturemaps.org/" target="_blank" rel="noopener">Overture Maps Foundation</a> (CDLA-Permissive-2.0) ·
      teren izvan naselja: Copernicus DEM GLO-30 (© DLR e.V. 2010-2014 i © Airbus Defence and Space GmbH 2014-2018, COPERNICUS, Europska unija i ESA) ·
      naoblaka <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.</p>
  </template>

  <script type="module" src="app.js?v=23"></script>
</body>
</html>
